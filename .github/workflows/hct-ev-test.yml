name: hct-ev-test
on:
  push:
    branches: [hct-ga-b5-win2025]
    paths: ['.github/workflows/hct-ev-test.yml', 'hct_ev/**']
jobs:
  ev:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: HiEvidence run test (ASCII args only; app file has UTF-8 BOM)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $PSVersionTable.PSVersion.ToString()
          (Get-CimInstance Win32_OperatingSystem).Caption + ' ' + (Get-CimInstance Win32_OperatingSystem).Version
          $S = Join-Path $PWD 'hct_ev\HiEvidence.ps1'
          'app sha256: ' + (Get-FileHash -Algorithm SHA256 $S).Hash.ToLower()
          [void](New-Item -ItemType Directory -Force C:\evt\watch)
          'a-result' | Set-Content C:\evt\watch\alive.tsv -Encoding UTF8
          'b-resource' | Set-Content C:\evt\watch\res.csv -Encoding UTF8
          'input' | Set-Content C:\evt\input.bin -Encoding UTF8
          $t = Start-Process ping -ArgumentList '-n','35','127.0.0.1' -PassThru -WindowStyle Hidden
          'target pid ' + $t.Id
          & powershell -NoProfile -ExecutionPolicy Bypass -File $S -Mode Start -Case runner-test -Root C:\evt\root -Watch C:\evt\watch -Target PING -Inputs C:\evt\input.bin -Interval 15 -Poll 2 -MaxMinutes 1
          'Start exit: ' + $LASTEXITCODE
          & powershell -NoProfile -ExecutionPolicy Bypass -File $S -Mode Event -Root C:\evt\root -Label manual_event -Note manual-event-test
          'Event exit: ' + $LASTEXITCODE
          & powershell -NoProfile -ExecutionPolicy Bypass -File $S -Mode Verify -Root C:\evt\root
          'Verify(normal) exit: ' + $LASTEXITCODE
          Get-ChildItem C:\evt\root -File -Filter *.tsv | ForEach-Object { '--- ' + $_.Name; Get-Content $_.FullName -Encoding UTF8 }
          '--- files'
          Get-ChildItem C:\evt\root -Recurse -File | ForEach-Object { $_.FullName.Substring(9) + ' ' + $_.Length }
          '--- watch folder unchanged?'
          Get-ChildItem C:\evt\watch -File | ForEach-Object { $_.Name + ' ' + $_.Length + ' ' + (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower() }
          '--- tamper test'
          $v = Get-ChildItem C:\evt\root -Recurse -File | Where-Object { $_.DirectoryName -ne 'C:\evt\root' } | Select-Object -First 1
          $v.FullName
          Add-Content $v.FullName 'x'
          & powershell -NoProfile -ExecutionPolicy Bypass -File $S -Mode Verify -Root C:\evt\root
          'Verify(tamper) exit: ' + $LASTEXITCODE
