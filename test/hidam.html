<!doctype html>
<html lang="ko">
<head><script src="/sec-lite.js?v=20261107s2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<base href="../">
<title>[시뮬레이션] HiDAM.app 기준 구현 시뮬레이션</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2330;--sub:#5b6577;--line:#dfe3ea;--navy:#1f2f55;--red:#d32f2f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;font-size:15px;line-height:1.5}
.ban{position:sticky;top:0;z-index:9;background:var(--red);color:#fff;font-weight:800;padding:8px 16px;text-align:center}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:14px 0 4px}h2{font-size:17px;margin:26px 0 8px}.sub{color:var(--sub);font-size:13.5px}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.box b{display:block;font-size:22px;white-space:nowrap}.box span{font-size:13px;color:var(--sub);white-space:nowrap}
.box.on{background:var(--navy);color:#fff;border-color:var(--navy)}.box.on span{color:#cfd7ea}
.tw{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#eef1f6;font-weight:700}td.w{white-space:normal;min-width:260px}tr:last-child td{border-bottom:0}
.pg{display:flex;gap:6px;align-items:center;justify-content:center;padding:8px;font-size:14px}
.pg button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;cursor:pointer;font:inherit}.pg button.on{background:var(--navy);color:#fff}
.ok{color:#17803d;font-weight:700}.no{color:var(--red);font-weight:700}
.g-위험{color:var(--red);font-weight:700}.g-경고{color:#c2410c;font-weight:700}.g-경계{color:#b45309;font-weight:700}.g-주의{color:#4b5563;font-weight:700}
svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div class="ban">시뮬레이션 — 실측이 아닙니다 (만든 파일로 돌린 값)</div>
<div class="wrap">
<h1>HiDAM.app 기준 구현 시뮬레이션</h1>
<div class="sub" id="meta"></div>
<div class="boxes" id="boxes"></div>
<h2 id="tt">시나리오</h2>
<div class="tw"><table><thead><tr><th>번호</th><th>시나리오</th><th>규칙</th><th>판정</th><th>본 것</th></tr></thead><tbody id="tb"></tbody></table><div class="pg" id="pg"></div></div>
<h2>대시보드 아홉 칸(기기 판) 보기</h2>
<div class="tw"><table><thead><tr><th>칸</th><th>값</th></tr></thead><tbody id="ds"></tbody></table></div>
<h2>한계</h2>
<div class="sub">시나리오와 구현을 같은 쪽이 썼습니다. 만든 파일은 수가 적고 깨끗합니다. 판정 대기 비율·빠르기·닮음 판정은 실제 매체 시험에서 잽니다. 기준: HiDAM 표준 정립서 1.0의 20장.</div>
</div>
<script>
const G={'가 분류·보안 분류':[1,2,3,4,5,6,7,8],'나 보호·자가 통제·연결':[9,10,11,25],'다 최적화·정합':[12,13,14,15,16,17,28],'라 미러링·자동':[18,19,20,21,26,29],'마 다 대 다':[27],'바 복구·원장·Cloud':[22,23,24,30,31]};
let D,cur='전체',page=1;const N=15;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function rows(){return cur==='전체'?D.cases:D.cases.filter(c=>G[cur].includes(+c.no.slice(3)))}
function draw(){const r=rows(),n=Math.max(1,Math.ceil(r.length/N));if(page>n)page=n;
 document.getElementById('tt').textContent='시나리오 — '+cur+' ('+r.length+'건)';
 document.getElementById('tb').innerHTML=r.slice((page-1)*N,page*N).map(c=>'<tr><td>'+c.no+'</td><td>'+esc(c.title)+'</td><td>'+esc(c.rule)+'</td><td class="'+(c.result==='통과'?'ok':'no')+'">'+c.result+'</td><td class="w">'+esc(c.seen)+'</td></tr>').join('');
 let p='<button onclick="go('+(page-1)+')">◀ 이전</button>';for(let i=1;i<=n;i++)p+='<button class="'+(i===page?'on':'')+'" onclick="go('+i+')">'+i+'</button>';
 document.getElementById('pg').innerHTML=p+'<button onclick="go('+(page+1)+')">다음 ▶</button>';
 document.querySelectorAll('.box').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));}
function go(i){const n=Math.max(1,Math.ceil(rows().length/N));page=Math.min(n,Math.max(1,i));draw()}
function pick(k){cur=k;page=1;draw()}
fetch('cowork/ctl/sim_hidam_app_result.json?v=1').then(r=>r.json()).then(d=>{D=d;
 document.getElementById('meta').textContent='정책 판 '+d.policy+' · 코드 해시 '+d.code_sha256.slice(0,16)+' · '+d.note;
 const pass=k=>{const r=(k==='전체'?d.cases:d.cases.filter(c=>G[k].includes(+c.no.slice(3))));return r.filter(c=>c.result==='통과').length+' / '+r.length};
 document.getElementById('boxes').innerHTML=['전체',...Object.keys(G)].map(k=>'<button class="box" data-k="'+k+'" onclick="pick(\''+k+'\')"><b>'+pass(k)+'</b><span>'+k+'</span></button>').join('');
 document.getElementById('ds').innerHTML=Object.entries(d.dashboard_sample).map(([k,v])=>'<tr><td>'+esc(k.replace('_',' '))+'</td><td class="w">'+esc(JSON.stringify(v))+'</td></tr>').join('');
 draw();});
</script>
</body>
</html>
