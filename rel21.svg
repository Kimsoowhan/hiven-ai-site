<rect x="48" y="1172" width="360" height="52" rx="10" fill="#0b1640"/><text x="228" y="1194" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">① 최상위 · HIVEN 자동화 통합 통제 시스템</text><text x="228" y="1213" text-anchor="middle" font-size="11.5" fill="#dfe6ff">(위 도면 맨 위 상자와 같은 시스템)</text>
