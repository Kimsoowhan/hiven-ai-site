<text x="48" y="1250" font-size="12.5" fill="#444">연계 접점: 사업군 접점 30건(C-01~C-30)과 별도로 보안체계 연계 접점 11건(S-01~S-11)을 둡니다. 상세 구조는 별도 도면 「이상징후 및 보안체계 구조도 1.0」, 표는 SC-16 「편입·연계 서비스 플로어」.</text>
<text x="48" y="1270" font-size="12.5" fill="#444">외부 연동 시스템 대상은 1순위(직접 연계) · 2순위(간접 관계) · 3순위(그 밖의 위험 요소)로 나뉘며 경보 12단계로 발령합니다. 제1순위 경로: ic 인트로 열쇠 입력(불일치 1회부터 즉시 보호 단계).</text>
