<!doctype html>
<html lang="ko">
<head>
<script src="/sec-lite.js?v=20261112r7"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>HIVEN 대표 일정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=20261113b1">
<style>
/* 대표 일정 화면(이력 1240~1242) — 통합관제 style.css 의 색·글씨체를 그대로 쓰고 이 화면에만 필요한 꼴을 더함 */
html,body{overflow-x:hidden}
#sch{min-height:100vh;display:flex;flex-direction:column}
#sch .body{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:16px 16px 28px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--tx);padding:7px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px;min-width:0}
.box>.k{font-size:13px;color:var(--sub);margin:0 0 8px;font-weight:600}
.scr{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
/* 얼럿 띠 */
.alb{display:flex;flex-direction:column;gap:6px}
.al{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:9px 12px;border-radius:10px;border:1px solid;font-size:14px}
.al b.d{font-size:15px;min-width:54px}
.al .t{font-weight:700}
.al .w{flex-basis:100%;font-size:13px;opacity:.92}
.al.past{background:#fdecea;border-color:#d64545;color:#8e1c1c}
.al.d1{background:#fdecea;border-color:#d64545;color:#8e1c1c}
.al.d3{background:#fff3e0;border-color:#ef6c00;color:#8a3d00}
.al.d7{background:#fffbe6;border-color:#d4a800;color:#5f4b00}
.al.none{background:#eef3fa;border-color:var(--line);color:var(--sub)}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--sub);margin-top:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* 표 */
table.st{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
table.st th,table.st td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.st th{background:#f0f4fa;color:var(--navy);font-weight:600;white-space:nowrap}
table.st td.n{white-space:nowrap}
tr.cx td{color:var(--gray);text-decoration:line-through}
tr.hl td{background:#fff6d6;transition:background .3s}
.st-b{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:#eef3fa;color:var(--navy);white-space:nowrap}
.pre{border:0;background:#e3ecfa;color:var(--navy);border-radius:6px;padding:1px 7px;margin:1px 2px;font-size:12.5px}
/* 달력 */
.calh{display:flex;align-items:center;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.calh .m{font-size:17px;font-weight:700;color:var(--navy);margin-right:auto}
.calh button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{font-size:12px;text-align:center;color:var(--sub);padding:2px 0}
.cal .wd.su,.cal .c.su .dn{color:#d64545}.cal .wd.sa,.cal .c.sa .dn{color:#1565c0}
.cal .c{min-height:76px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px;text-align:left;font-size:12px;overflow:hidden;min-width:0;display:flex;flex-direction:column;gap:2px}
.cal .c.out{background:#f7f9fc;opacity:.55}
.cal .c.td{border:2px solid var(--sky)}
.cal .c.has{cursor:pointer}
.cal .c .dn{font-weight:700;font-size:12.5px}
.cal .ev{display:flex;gap:3px;align-items:flex-start;line-height:1.25;min-width:0}
.cal .ev i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:3px}
.cal .ev span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.cal .ev.cx span{text-decoration:line-through;color:var(--gray)}
.cal .ev.cx i{opacity:.4}
@media (max-width:520px){.cal .c{min-height:58px;padding:3px}.cal .ev span{-webkit-line-clamp:1;font-size:11px}}
/* 띠 그림 */
.gt{position:relative;font-size:12px}
.gt .g-row{display:flex;border-bottom:1px solid var(--line);min-height:34px}
.gt .lb{position:sticky;left:0;z-index:3;flex:none;width:132px;background:#fff;padding:6px 8px;font-weight:600;color:var(--navy);border-right:1px solid var(--line);line-height:1.3}
.gt .ln{position:relative;flex:none}
.gt .hd .ln div{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:6px 4px;color:var(--sub);white-space:nowrap}
.gt .hd .lb{color:var(--sub)}
.gt .bar{position:absolute;height:14px;border-radius:7px;background:var(--indigo);opacity:.85}
.gt .bar.mm{background:#c5d3f0;opacity:1;border:1px solid #8ea4d8}
.gt .bar.done{background:var(--ok)}
.gt .bar.go{background:var(--sky)}
.gt .tx{position:absolute;white-space:nowrap;font-size:11.5px;color:var(--tx);pointer-events:none}
.gt .pt{position:absolute;width:11px;height:11px;border-radius:50%;margin-left:-5px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2);cursor:pointer}
.gt .pt.op{background:#fff;border:2px solid var(--indigo)}
.gt .g-grid{position:absolute;top:0;bottom:0;border-left:1px dashed #e6ebf3}
.gt .now{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #d64545;z-index:2}
.gt .now span{position:absolute;top:0;left:3px;background:#d64545;color:#fff;font-size:11px;padding:0 4px;border-radius:4px;white-space:nowrap}
.nod{font-size:12.5px;color:var(--sub);margin-top:8px}
/* 팝업 */
#pop{position:fixed;inset:0;z-index:9000;background:rgba(14,27,61,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#pop .pw{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:16px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#pop .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#pop .ph b{font-size:16px;color:var(--navy);margin-right:auto}
#pop .ph button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;font-size:13px}
#pop .it{border-top:1px solid var(--line);padding:10px 0}
#pop .it.cx .tt{text-decoration:line-through;color:var(--gray)}
#pop dl{display:grid;grid-template-columns:76px 1fr;gap:3px 8px;margin:6px 0 0;font-size:13.5px}
#pop dt{color:var(--sub)}#pop dd{margin:0;min-width:0;word-break:break-all}
.ft{font-size:12px;color:var(--sub);margin-top:6px}
/* 잠그는 값 안내(이력 1249) */
.lv{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f7f9fc;text-align:left;min-width:0}
.lv-t{display:block;font-size:14.5px;color:var(--navy);margin-bottom:6px}
.lv-k{font-size:12.5px;color:var(--sub);margin-bottom:4px}
.lv-r{display:flex;gap:6px;align-items:stretch;min-width:0}
.lv-v{flex:1;min-width:0;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;word-break:break-all;user-select:all;color:var(--tx)}
.lv-c{flex:none;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:0 14px;font-size:13.5px;font-weight:600}
.lv-n{font-size:13px;color:var(--tx);margin-top:8px;line-height:1.5;word-break:keep-all}
.lv-m{font-size:12.5px;color:var(--ok);margin-top:4px;min-height:1em}

</style>
</head>
<body>

<section id="intro">
 <div class="ibox">
  <div class="eng">HIVEN · Solopreneur</div>
  <h1>대표 일정<br><span>개인 일정 · 전체 일정</span></h1>
  <p>통합관제(IC)와 같은 열쇠로 엽니다.</p>
  <form id="f" autocomplete="off">
   <input id="k" type="password" lang="en" inputmode="latin" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="열쇠 입력" aria-label="열쇠" autocomplete="off">
   <button class="go" type="submit">들어가기</button>
  </form>
  <div id="err" role="alert"></div>
  <div id="lockv"></div>
  <div class="note">일정 자료는 열쇠로만 풀리는 암호 묶음으로 실려 있습니다.</div>
 </div>
</section>

<div id="sch" class="hide">
 <header class="top">
  <div class="nm">HIVEN 대표 일정<small>Solopreneur · 개인 일정과 하이븐 전체 일정</small></div>
  <span class="chip">오늘(서울) <b id="today">-</b></span>
  <span class="chip">자료 <b id="gen">-</b></span>
  <span class="sp"></span>
  <a class="out" href="/index.html" style="text-decoration:none">통합관제</a>
  <button class="out" id="so" type="button">나오기</button>
 </header>
 <div class="body">
  <nav class="tabs" id="tabs" aria-label="일정 탭"></nav>
  <main id="view"></main>
 </div>
</div>

<div id="pop" class="hide" role="dialog" aria-modal="true" aria-labelledby="pop-t"><div class="pw"><div class="ph"><b id="pop-t"></b><button type="button" id="pop-x">닫기</button></div><div id="pop-b"></div></div></div>

<script src="sched-core.js?v=20261113s2"></script>
<script src="schedule.js?v=20261113s2"></script>
</body>
</html>
